name: Build Installers

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label (e.g. v1.2.0). Defaults to git-derived string."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-installer:
    name: Installer (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
          - name: Linux
            os: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Ensure embedded asset placeholders
        shell: bash
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep
          mkdir -p build/windows
          touch build/windows/icon.ico

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Compute version string
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "APP_VERSION=${{ github.event.inputs.version }}" >> "$GITHUB_ENV"
          else
            echo "APP_VERSION=$(git log -1 --format=%cd-%h --date=format:%Y%m%d --abbrev=6)" >> "$GITHUB_ENV"
          fi

      - name: Generate Windows icon asset
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $iconPath = "build/windows/icon.ico"
          New-Item -ItemType Directory -Force -Path (Split-Path $iconPath) | Out-Null

          Add-Type -AssemblyName System.Drawing
          $bitmap = New-Object System.Drawing.Bitmap 256, 256
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::FromArgb(255, 16, 16, 18))
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 255, 214, 102))
          $graphics.FillEllipse($brush, 32, 32, 192, 192)

          $hIcon = $bitmap.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($hIcon)
          $stream = New-Object System.IO.FileStream($iconPath, [System.IO.FileMode]::Create)
          $icon.Save($stream)
          $stream.Close()

          $graphics.Dispose()
          $brush.Dispose()
          $bitmap.Dispose()

      - name: Build Windows NSIS installer
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          choco install nsis -y --no-progress
          $env:PATH += ";C:\Program Files (x86)\NSIS"
          wails build -nsis -ldflags "-X main.AppVersion=$env:APP_VERSION"

      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: silphium-windows-installer
          path: build/bin/*installer*.exe
          retention-days: 30

      - name: Build macOS app bundle
        if: runner.os == 'macOS'
        shell: bash
        run: wails build -ldflags "-X main.AppVersion=$APP_VERSION"

      - name: Ad-hoc sign macOS app
        if: runner.os == 'macOS'
        run: codesign --force --deep --sign - build/bin/Silphium.app

      - name: Create macOS DMG
        if: runner.os == 'macOS'
        run: |
          hdiutil create \
            -volname "Silphium" \
            -srcfolder build/bin/Silphium.app \
            -ov \
            -format UDZO \
            silphium-macos.dmg

      - name: Upload macOS DMG
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: silphium-macos-installer
          path: silphium-macos.dmg
          retention-days: 30

      - name: Build Linux binary
        if: runner.os == 'Linux'
        shell: bash
        run: wails build -tags webkit2_41 -ldflags "-X main.AppVersion=$APP_VERSION"

      - name: Create Linux .deb package
        if: runner.os == 'Linux'
        run: |
          mkdir -p deb/DEBIAN
          mkdir -p deb/usr/local/bin
          mkdir -p deb/usr/share/applications
          mkdir -p deb/usr/share/icons/hicolor/256x256/apps

          cp build/bin/Silphium deb/usr/local/bin/silphium
          chmod 755 deb/usr/local/bin/silphium

          if [ -f build/appicon.png ]; then
            cp build/appicon.png deb/usr/share/icons/hicolor/256x256/apps/silphium.png
          fi

          cat > deb/usr/share/applications/silphium.desktop << 'DESKTOP'
          [Desktop Entry]
          Version=1.0
          Type=Application
          Name=Silphium
          Comment=Desktop music player with MusicBrainz and ListenBrainz integration
          Exec=/usr/local/bin/silphium
          Icon=silphium
          Categories=Audio;Player;
          DESKTOP

          DEB_VERSION="${APP_VERSION#v}"

          cat > deb/DEBIAN/control << CONTROL
          Package: silphium
          Version: ${DEB_VERSION}
          Architecture: amd64
          Maintainer: Silphium Team
          Description: Desktop music player with local library and MetaBrainz integration
           Silphium is a desktop music player for carefully curated local music libraries,
           with MusicBrainz-aware metadata workflows and ListenBrainz/Last.fm integrations.
          CONTROL

          dpkg-deb --build deb silphium-linux-amd64.deb

      - name: Upload Linux .deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: silphium-linux-installer
          path: silphium-linux-amd64.deb
          retention-days: 30

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build-installer
    if: github.event.inputs.version != ''
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: installers
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version }}
          name: Silphium ${{ github.event.inputs.version }}
          files: installers/*
          generate_release_notes: true
