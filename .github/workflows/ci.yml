name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Ensure embedded asset placeholders
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep
          mkdir -p build/windows
          touch build/windows/icon.ico

      - name: Run frontend lint
        run: npm run lint
        working-directory: frontend

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@v1.64.8

      - name: Run golangci-lint
        run: $(go env GOPATH)/bin/golangci-lint run

      - name: Install golint
        run: go install golang.org/x/lint/golint@latest

      - name: Run golint
        run: golint ./...

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Ensure embedded asset placeholders
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep
          mkdir -p build/windows
          touch build/windows/icon.ico

      - name: Run Go tests
        run: go test ./... -count=1 -v

      - name: Set up Node.js for frontend tests
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Ensure embedded asset placeholders
        shell: bash
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep
          mkdir -p build/windows
          touch build/windows/icon.ico

      - name: Run frontend tests
        run: npm run test
        working-directory: frontend

  build:
    name: Silphium Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artifact: silphium-windows
            build-flags: -o Silphium.exe
            binary: build/bin/Silphium.exe
          - name: macOS
            os: macos-latest
            artifact: silphium-macos
            build-flags: ""
            binary: build/bin/Silphium.app
          - name: Linux
            os: ubuntu-latest
            artifact: silphium-linux
            build-flags: -tags webkit2_41
            binary: build/bin/Silphium

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      - name: Ensure embedded asset placeholders
        shell: bash
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep
          mkdir -p build/windows
          touch build/windows/icon.ico

      - name: Compute version string
        shell: bash
        run: echo "APP_VERSION=$(git log -1 --format=%cd-%h --date=format:%Y%m%d --abbrev=6)" >> "$GITHUB_ENV"

      - name: Generate Windows icon asset
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $iconPath = "build/windows/icon.ico"
          New-Item -ItemType Directory -Force -Path (Split-Path $iconPath) | Out-Null

          Add-Type -AssemblyName System.Drawing
          $bitmap = New-Object System.Drawing.Bitmap 256, 256
          $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
          $graphics.Clear([System.Drawing.Color]::FromArgb(255, 16, 16, 18))
          $brush = New-Object System.Drawing.SolidBrush([System.Drawing.Color]::FromArgb(255, 255, 214, 102))
          $graphics.FillEllipse($brush, 32, 32, 192, 192)

          $hIcon = $bitmap.GetHicon()
          $icon = [System.Drawing.Icon]::FromHandle($hIcon)
          $stream = New-Object System.IO.FileStream($iconPath, [System.IO.FileMode]::Create)
          $icon.Save($stream)
          $stream.Close()

          $graphics.Dispose()
          $brush.Dispose()
          $bitmap.Dispose()

      - name: Build application
        shell: bash
        run: wails build ${{ matrix.build-flags }} -ldflags "-X main.AppVersion=$APP_VERSION"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.binary }}
          retention-days: 14
